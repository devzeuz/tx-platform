<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Deployed via TX Platform S3 Golden Path</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top, #1e293b, #0f172a);
      color: #f8fafc;
      padding: 1.5rem;
    }
    .card {
      max-width: 560px;
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid #334155;
      border-radius: 16px;
      padding: 2rem;
      text-align: center;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }
    .pill {
      display: inline-block;
      background: rgba(34, 197, 94, 0.2);
      color: #4ade80;
      padding: 0.3rem 0.85rem;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 1rem;
    }
    h1 { margin: 0 0 0.75rem; font-size: 1.8rem; }
    p { color: #94a3b8; line-height: 1.6; margin: 0 0 1.25rem; }
    .flow {
      background: #0f172a;
      border: 1px solid #334155;
      border-radius: 10px;
      padding: 0.85rem;
      font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      font-size: 0.85rem;
      color: #38bdf8;
    }
  </style>
</head>
<body>
  <div class="card">
    <span class="pill">Live on AWS S3</span>
    <h1>TX Platform Golden Path</h1>
    <p>
      This website was provisioned and published automatically through the
      <strong>S3 Static Website Golden Path</strong> (`template.yaml` + Terraform + AWS S3).
    </p>
    <div class="flow">
      GitHub Repo &rarr; Control Plane &rarr; Terraform S3 &rarr; Live Link
    </div>
  </div>
</body>
</html>
